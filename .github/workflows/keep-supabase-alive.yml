name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 */8 * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Query Supabase healthcheck
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/healthcheck?select=id&limit=1"
